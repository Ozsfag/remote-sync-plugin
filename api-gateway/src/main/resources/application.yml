server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway, API-Gateway
      discovery:
        locator:
          enabled: false
      routes:
        # --- git-diff-service: ACTUATOR через gateway ---
        - id: git-diff-actuator
          uri: http://git-diff-service:8080
          predicates:
            - Path=/api/git/actuator/**
          filters:
            - RewritePath=/api/git/actuator/(?<segment>.*), /actuator/${segment}

        # --- ssh-sync-service: ACTUATOR через gateway ---
        - id: ssh-sync-actuator
          uri: http://ssh-sync-service:8080
          predicates:
            - Path=/api/ssh/actuator/**
          filters:
            - RewritePath=/api/ssh/actuator/(?<segment>.*), /actuator/${segment}

        # --- git-diff-service: Бизнес-API без StripPrefix ---
        - id: git-diff-api
          uri: http://git-diff-service:8080
          predicates:
            - Path=/api/git/**

        # --- ssh-sync-service: Бизнес-API без StripPrefix ---
        - id: ssh-sync-api
          uri: http://ssh-sync-service:8080
          predicates:
            - Path=/api/ssh/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
  prometheus:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

security:
  permitted-paths:
    - /actuator/**
    - /api/git/actuator/**
    - /api/ssh/actuator/**
