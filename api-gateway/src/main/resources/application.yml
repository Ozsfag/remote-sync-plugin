server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway, API-Gateway
      discovery:
        locator:
          enabled: false
      routes:
        # --- actuator git-diff через gateway: /api/git/actuator/** -> /actuator/**
        - id: git-diff-actuator
          uri: http://git-diff-service:8080
          predicates:
            - Path=/api/git/actuator/**
          filters:
            - StripPrefix=3

        # --- actuator ssh-sync через gateway: /api/ssh/actuator/** -> /actuator/**
        - id: ssh-sync-actuator
          uri: http://ssh-sync-service:8080
          predicates:
            - Path=/api/ssh/actuator/**
          filters:
            - StripPrefix=3

        # --- бизнес-API git-diff без переписывания путей
        - id: git-diff-api
          uri: http://git-diff-service:8080
          predicates:
            - Path=/api/git/**

        # --- бизнес-API ssh-sync без переписывания путей
        - id: ssh-sync-api
          uri: http://ssh-sync-service:8080
          predicates:
            - Path=/api/ssh/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
  prometheus:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

security:
  permitted-paths:
    - /actuator/**
    - /api/git/actuator/**
    - /api/ssh/actuator/**
