server:
  # внутри контейнера всегда 8080
  port: ${SERVER_PORT:8080}
  # слушать все интерфейсы (или просто убрать эту строку)
  address: 0.0.0.0

spring:
  application:
    name: git-diff-service

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true
  prometheus:
    enabled: true
