services:
  git-diff-service:
    image: ghcr.io/ozsfag/git-diff-service:latest
    build:
      context: ./git-diff-service
    environment:
      - SERVER_PORT=8080
    ports:
      - "8081:8080"
    pull_policy: if_not_present
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monitoring]

  ssh-sync-service:
    image: ghcr.io/ozsfag/ssh-sync-service:latest
    build:
      context: ./ssh-sync-service
    environment:
      - SERVER_PORT=8080
    ports:
      - "8082:8080"
    depends_on:
      git-diff-service:
        condition: service_healthy
    pull_policy: if_not_present
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monitoring]

  api-gateway:
    image: ghcr.io/ozsfag/api-gateway:latest
    build:
      context: ./api-gateway
    environment:
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8083:8080"
    depends_on:
      git-diff-service:
        condition: service_healthy
      ssh-sync-service:
        condition: service_healthy
    pull_policy: if_not_present
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monitoring]

networks:
  monitoring:
