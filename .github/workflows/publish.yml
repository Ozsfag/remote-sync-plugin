name: Build & Publish to JetBrains Marketplace

on:
  workflow_dispatch: { }
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      REMOTE_SYNC_GH_TOKEN: ${{ secrets.REMOTE_SYNC_GH_TOKEN }}
      REMOTE_SYNC_REPO_OWNER: ${{ secrets.REMOTE_SYNC_REPO_OWNER }}
      REMOTE_SYNC_REPO_NAME: ${{ secrets.REMOTE_SYNC_REPO_NAME }}

      SERVER_PORT: ${{ secrets.GIT_DIFF_SERVER_PORT }}
      SERVER_ADDRESS: ${{ secrets.GIT_DIFF_SERVER_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gradlew is executable (safety)
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build service JAR
        run: ./gradlew :shared-dto:build :git-diff-service:bootJar --stacktrace

      - name: Start git-diff-service (background)
        shell: bash
        run: |
          JAR=$(ls git-diff-service/build/libs/git-diff-service-*.jar | head -n1)
          PORT="${SERVER_PORT}"
          ADDR="${SERVER_ADDRESS}"
          nohup java -jar "$JAR" \
            --server.port="$PORT" \
            --server.address="$ADDR" \
            > gitdiff.log 2>&1 &
          echo $! > gitdiff.pid
          echo "git-diff-service started (pid=$(cat gitdiff.pid)) at http://$ADDR:$PORT"
          # мини-пауза без /health
          sleep 2

      - name: Build, Sign & Publish
        uses: gradle/gradle-build-action@v2
        with:
          arguments: publishRelease --stacktrace
        env:
          JB_PUBLISH_TOKEN: ${{ secrets.JB_PUBLISH_TOKEN }}

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-sync-plugin
          path: ui/build/distributions/*.zip

      - name: Print git-diff-service logs
        if: always()
        run: |
          echo "==== git-diff-service last logs ===="
          tail -n 200 gitdiff.log || true

      - name: Stop git-diff-service
        if: always()
        run: |
          if [ -f gitdiff.pid ]; then
            kill $(cat gitdiff.pid) || true
            sleep 2
          fi
